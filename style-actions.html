<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Actions (dev host)</title>
    <!--
      Inter 4.1 (github.com/rsms/inter, release v4.1), self-hosted from public/fonts/ under the
      SIL Open Font License 1.1 (public/fonts/OFL.txt). The test runner forbids third-party
      origins, so this host does not use Google Fonts; the weights match the main app's link
      (400, 500, 600, 700). Decision F-D7, Scope 1a R9.
    -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/Inter-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/Inter-Medium.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/Inter-SemiBold.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/Inter-Bold.woff2') format('woff2'); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/modules/style-actions-product/host/main.tsx"></script>
  </body>
</html>
